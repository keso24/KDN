plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kessler.kroute'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file('ci/kroute-test.jks')
            storePassword 'kroute-test'
            keyAlias 'kroute-test'
            keyPassword 'kroute-test'
        }
    }

    defaultConfig {
        applicationId 'com.kessler.kroute'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
